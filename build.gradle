plugins {
	id 'net.fabricmc.fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		url = 'https://api.modrinth.com/maven'
	}
	mavenCentral()
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings dependency: Minecraft 26.1+ ships unobfuscated (official names already),
	// and this is how Fabric's own template configures 26.x — Loom needs a build newer than
	// the 1.17.20 stable release (hence the 1.17-SNAPSHOT plugin version below) to allow this.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "maven.modrinth:malilib:${project.malilib_version}"
}

processResources {
	inputs.property "version", project.version
	filteringCharset "UTF-8"

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
	it.options.encoding = "UTF-8"
	it.options.release.set(targetJavaVersion)
}

java {
	toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
	withSourcesJar()
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}
